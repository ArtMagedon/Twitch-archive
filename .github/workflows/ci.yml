name: Build and validate

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate backend syntax and imports
        run: |
          python -m compileall -q backend
          python -c "from backend.main import app; print(app.title, app.version)"

      - name: Build frontend
        run: |
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run build

      - name: Build Docker image
        run: docker build -t twitch-archive:ci .
